server {
    listen 80;
    root /usr/share/nginx/html;

    # API and the live event stream, proxied to the backend container.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-Sent Events: deliver each event immediately and keep the stream open.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed build assets never change, so browsers can cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path serves index.html.
    location / {
        try_files $uri /index.html;
    }
}
